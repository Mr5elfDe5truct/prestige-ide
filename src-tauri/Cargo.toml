[package]
name = "prestige-ide"
version = "0.1.1"
description = "Prestige IDE by R.G. Studios: a local agentic coding IDE"
authors = ["Ryan B. Gyles"]
license = "MIT"
edition = "2021"

[lib]
name = "prestige_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
regex = "1"
portable-pty = "0.9"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
